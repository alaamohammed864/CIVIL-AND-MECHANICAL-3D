workflows:
  android-apk:
    name: 4M Engineering Cloud - Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.engineering4m.cloud"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.npm
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Build Web CAD/BIM bundle
        script: |
          npm run build
      - name: Ensure Capacitor Android project and sync assets
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Configure Android SDK and Gradle permissions
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          chmod +x "$CM_BUILD_DIR/android/gradlew"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      - name: Build installable Android APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleDebug
          if [ -n "${FCI_KEYSTORE:-}" ]; then
            echo "$FCI_KEYSTORE" | base64 --decode > /tmp/release.keystore
            cat <<EOF > "$CM_BUILD_DIR/android/key.properties"
          storePassword=$FCI_KEYSTORE_PASSWORD
          keyPassword=$FCI_KEY_PASSWORD
          keyAlias=$FCI_KEY_ALIAS
          storeFile=/tmp/release.keystore
          EOF
            ./gradlew assembleRelease
          fi
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - lm163674@gmail.com
        notify:
          success: true
          failure: true

  android-play-release:
    name: 4M Engineering Cloud - Play Store AAB & Signed APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - keystore_credentials
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.engineering4m.cloud"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.npm
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Build Web CAD/BIM bundle
        script: |
          npm run build
      - name: Sync Capacitor Android project
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Configure Android SDK and Keystore
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          chmod +x "$CM_BUILD_DIR/android/gradlew"
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
          cat <<EOF > "$CM_BUILD_DIR/android/key.properties"
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF
      - name: Build Release AAB and APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - lm163674@gmail.com
        notify:
          success: true
          failure: true
